# Nightly read-only drift check of lab, demo and showcase; off until CLOUD_ENVS_ENABLED is "true".
# A finding opens or updates the issue "Drift detected: <env>".
name: drift

on:
  schedule:
    - cron: "23 3 * * *"   # every night at 03:23 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: drift
  cancel-in-progress: false

jobs:
  drift:
    name: drift (${{ matrix.env }})
    if: vars.CLOUD_ENVS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: lab-plan
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        env: [lab, demo, showcase]
    env:
      SOPS_VERSION: 3.13.3
      SOPS_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install OpenTofu and SOPS (sha256-pinned)
        run: |
          set -euo pipefail
          bash scripts/install_tofu_tools.sh "$RUNNER_TEMP/tools" tofu
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/tools/sops" \
            "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          echo "${SOPS_SHA256}  $RUNNER_TEMP/tools/sops" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/tools/sops"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"

      - name: Drift check (summary by resource only)
        id: check
        env:
          ENV: ${{ matrix.env }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: bash scripts/cloud_ci.sh drift "$ENV"

      - name: Hand the report to the issue job
        if: steps.check.outputs.drift == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: drift-${{ matrix.env }}
          path: ${{ runner.temp }}/drift-${{ matrix.env }}.md
          if-no-files-found: error
          retention-days: 1

  issue:
    name: drift issues
    needs: drift
    if: vars.CLOUD_ENVS_ENABLED == 'true' && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write  # open the issue "Drift detected: <env>" or comment on it
    steps:
      - name: Fetch the reports of this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: drift-*
          merge-multiple: true
          path: ${{ runner.temp }}/drift

      - name: Open or update one issue per environment with drift
        env:
          GH_TOKEN: ${{ github.token }}
          REPORTS: ${{ runner.temp }}/drift
        run: |
          set -euo pipefail
          for env in lab demo showcase; do
            report="${REPORTS}/drift-${env}.md"
            [ -f "$report" ] || continue
            title="Drift detected: ${env}"
            number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"${title}\"" \
              --json number,title --jq "map(select(.title == \"${title}\")) | first | .number // empty")
            if [ -n "$number" ]; then
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$report"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$report"
            fi
          done
