# Nightly drift check of lab, demo and showcase (docs/adr/0023). Off until the repository variable
# CLOUD_ENVS_ENABLED is "true". Each job plans its environment read-only with -detailed-exitcode
# in the GitHub environment lab-plan (secrets/<env>-ci.enc.env); an environment that does not exist
# (no resource in its state) or lab while it is switched off is skipped. For demo it also lists
# cloud servers labelled env=demo and demo-* objects in Cloudflare that no run removed, because the
# demo is destroyed after each use. A finding opens the issue "Drift detected: <env>" or adds a
# comment to the open one; the report names resources only, never the zone or an ID.
# The jobs that decrypt the credentials and run OpenTofu and its providers can only read the
# repository. A finding's report goes to the job "issue" as an artifact of this run (the anonymised
# text of the issue, kept for one day); that job has no environment and no secret, and the issues
# write permission only.
# GitHub turns off scheduled workflows of a public repository after 60 days without activity:
# the runbook has the monthly check.
name: drift

on:
  schedule:
    - cron: "23 3 * * *"   # every night at 03:23 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: drift
  cancel-in-progress: false

jobs:
  drift:
    name: drift (${{ matrix.env }})
    if: vars.CLOUD_ENVS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: lab-plan
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        env: [lab, demo, showcase]
    env:
      SOPS_VERSION: 3.13.3
      SOPS_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install OpenTofu and SOPS (sha256-pinned)
        run: |
          set -euo pipefail
          bash scripts/install_tofu_tools.sh "$RUNNER_TEMP/tools" tofu
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/tools/sops" \
            "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          echo "${SOPS_SHA256}  $RUNNER_TEMP/tools/sops" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/tools/sops"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"

      - name: Drift check (summary by resource only)
        id: check
        env:
          ENV: ${{ matrix.env }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: bash scripts/cloud_ci.sh drift "$ENV"

      - name: Hand the report to the issue job
        if: steps.check.outputs.drift == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drift-${{ matrix.env }}
          path: ${{ runner.temp }}/drift-${{ matrix.env }}.md
          if-no-files-found: error
          retention-days: 1

  issue:
    name: drift issues
    needs: drift
    if: vars.CLOUD_ENVS_ENABLED == 'true' && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write  # open the issue "Drift detected: <env>" or comment on it
    steps:
      - name: Fetch the reports of this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: drift-*
          merge-multiple: true
          path: ${{ runner.temp }}/drift

      - name: Open or update one issue per environment with drift
        env:
          GH_TOKEN: ${{ github.token }}
          REPORTS: ${{ runner.temp }}/drift
        run: |
          set -euo pipefail
          for env in lab demo showcase; do
            report="${REPORTS}/drift-${env}.md"
            [ -f "$report" ] || continue
            title="Drift detected: ${env}"
            number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"${title}\"" \
              --json number,title --jq "map(select(.title == \"${title}\")) | first | .number // empty")
            if [ -n "$number" ]; then
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$report"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$report"
            fi
          done
