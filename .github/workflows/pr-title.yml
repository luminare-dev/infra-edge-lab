# Checks the pull request title (it becomes the squash commit). Required check: "pr / pr-title".
name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr:
    uses: ./.github/workflows/reusable-ci.yml
    with:
      run-lint-test: false
      check-pr-title: true
    permissions:
      contents: read
