# release-please on every push to main.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !github.event.repository.is_template }}
    uses: ./.github/workflows/reusable-release.yml
    permissions:
      contents: write        # release commit, tag, draft release, attached files
      pull-requests: write   # the release pull request
      issues: write          # release-please labels
      id-token: write        # Sigstore certificate for the attestation
      attestations: write    # store the attestation
    with:
      # The tests run again on the release tag before the archive is built.
      test-command: bash scripts/run_tests.sh
