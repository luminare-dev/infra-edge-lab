# Checks before each commit (https://pre-commit.com): "pre-commit install" once, then every
# "git commit" runs the hooks on the staged files; "pre-commit run --all-files" runs them on the
# whole repository. CI runs the same checks in its own jobs (task lint, task test, task tofu), so
# the hooks only report a problem earlier.
#
# Hooks from other repositories are pinned to a commit SHA (the tag in the comment, as
# "pre-commit autoupdate --freeze" writes it); tests/test_repository_layout.py checks this. The
# other hooks run the tools of this repository in the versions of docs/toolchain.md: yamllint and
# ansible-lint from the hash-pinned virtual environment ("task venv", then put .venv/bin on the
# PATH), gitleaks, SOPS, OpenTofu and TFLint as installed binaries.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^docs/brand/
      - id: trailing-whitespace
        exclude: ^docs/brand/

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95  # frozen: v0.11.0.1
    hooks:
      - id: shellcheck

  # gitleaks from the PATH (docs/toolchain.md) on the staged changes, with .gitleaks.toml.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks-system
        pass_filenames: false

  - repo: local
    hooks:
      - id: yamllint
        name: yamllint (strict)
        entry: yamllint --strict
        language: system
        types: [yaml]

      - id: sops-encrypted
        name: secrets are SOPS-encrypted
        description: Refuses a file in secrets/ named *.enc.env that sops does not report as encrypted.
        entry: >-
          bash -c 'status=0; for file in "$@"; do
          sops filestatus "$file" | grep -q "\"encrypted\":true"
          || { echo "$file is not encrypted with SOPS (sops encrypt --in-place $file)"; status=1; }; done;
          exit $status' --
        language: system
        files: ^secrets/.*\.enc\.env$

      - id: tofu-fmt
        name: tofu fmt
        entry: tofu fmt -check -diff
        language: system
        files: \.(tf|tofu|tftest\.hcl)$

      - id: tflint
        name: TFLint
        entry: bash scripts/check_tofu.sh tflint
        language: system
        files: ^(tofu/|\.tflint\.hcl$)
        pass_filenames: false

      - id: ansible-lint
        name: ansible-lint (production profile)
        entry: bash -c 'ANSIBLE_ROLES_PATH="$PWD/ansible/roles" ansible-lint'
        language: system
        files: ^(ansible/|\.ansible-lint$|\.config/molecule/)
        pass_filenames: false
