# yamllint configuration (https://yamllint.readthedocs.io/)
extends: default

ignore: |
  node_modules/
  .venv/
  .ansible/
  .terraform/
  ansible/collections/

rules:
  document-start: disable          # GitHub workflow and form files do not use "---"
  line-length:
    max: 120
  comments:
    min-spaces-from-content: 1
  truthy:
    check-keys: false              # "on:" in workflows
  # The four settings below are the ones ansible-lint requires from a yamllint configuration.
  comments-indentation: false
  braces:
    max-spaces-inside: 1
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
