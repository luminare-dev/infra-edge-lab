# Task runner (https://taskfile.dev; go-task version in docs/toolchain.md). "task --list" shows
# every target. "task lint", "task test", "task tofu" and "task molecule" run the checks and tests
# that CI runs; "task init", "task plan" and "task test" with ENV=<local|lab|demo|showcase> work
# on one environment under tofu/envs (scripts/tofu_env.sh).
version: "3"

vars:
  # Python virtual environment for the hash-pinned tools; override with "task lint VENV=path".
  VENV: '{{.VENV | default ".venv"}}'

tasks:
  default:
    desc: List the tasks
    silent: true
    cmds:
      - task --list

  venv:
    desc: Create the Python environment with the hash-pinned tools (requirements-dev.txt, requirements-test.txt)
    sources:
      - requirements-dev.txt
      - requirements-test.txt
    generates:
      - "{{.VENV}}/pyvenv.cfg"
    cmds:
      - test -x "{{.VENV}}/bin/python" || python3 -m venv "{{.VENV}}"
      - >-
        "{{.VENV}}/bin/python" -m pip install --quiet --disable-pip-version-check
        --require-hashes --only-binary=:all: -r requirements-dev.txt
      - >-
        "{{.VENV}}/bin/python" -m pip install --quiet --disable-pip-version-check
        --require-hashes --only-binary=:all: -r requirements-test.txt

  lint:
    desc: Run the repository checks (CI lint-test and the secret scan, plus tofu fmt)
    deps: [venv]
    cmds:
      - python3 scripts/forbidden_words.py
      - python3 scripts/set_byline.py verify --expect studio
      - python3 scripts/check_workflows.py
      - '"{{.VENV}}/bin/yamllint" --strict .'
      - npx --yes markdownlint-cli2@0.23.2 "**/*.md"
      - actionlint
      - '"{{.VENV}}/bin/zizmor" --offline --min-severity=low .github/workflows'
      - gitleaks git --redact --config .gitleaks.toml .
      - tofu fmt -check -recursive tofu

  test:
    desc: >-
      Run the unit tests and ansible-lint (the test command of CI); with
      ENV=<local|lab|demo|showcase>, the mocked tofu tests of that environment instead
    env:
      TEST_VENV: "{{.VENV}}"
    cmds:
      - '{{if .ENV}}bash scripts/tofu_env.sh test {{.ENV}} {{.CLI_ARGS}}{{else}}bash scripts/run_tests.sh{{end}}'

  init:
    desc: >-
      Initialise one environment (ENV=local|lab|demo|showcase); BACKEND=local keeps the state of
      lab, demo or showcase in a local file instead of the remote backend (git-ignored
      backend_override.tf). Needs TF_VAR_state_passphrase and, for the remote backend,
      AWS_ENDPOINT_URL_S3, from secrets/<env>.enc.env (or the SOPS file named by SECRETS) when it
      exists
    requires:
      vars:
        - name: ENV
          enum: [local, lab, demo, showcase]
    env:
      BACKEND: '{{.BACKEND | default "remote"}}'
    cmds:
      - bash scripts/tofu_env.sh init {{.ENV}} {{.CLI_ARGS}}

  plan:
    desc: >-
      Plan one environment (ENV=local|lab|demo|showcase; tofu plan arguments after "--"); a plan
      never reads the tunnel token. Credentials come from secrets/<env>.enc.env (or the SOPS file
      named by SECRETS) when it exists
    requires:
      vars:
        - name: ENV
          enum: [local, lab, demo, showcase]
    cmds:
      - bash scripts/tofu_env.sh plan {{.ENV}} {{.CLI_ARGS}}

  tofu:
    desc: >-
      Run the OpenTofu checks of CI's "tofu" job: fmt, validate, TFLint, the IaC security scan
      (Trivy), the mocked tests, the docker_host test on the local Docker daemon and the Terraform
      compatibility check (choose steps with "task tofu STEPS='fmt validate tflint iac test compat'")
    cmds:
      - bash scripts/check_tofu.sh {{.STEPS | default "all"}}

  molecule:
    desc: >-
      Run the Molecule scenario of one role in ansible/roles (ROLE=docker|monitoring|deploy_target)
      on both platforms, or on one with PLATFORM=debian13|ubuntu2404, as CI's molecule jobs do
    deps: [venv]
    requires:
      vars:
        - name: ROLE
          enum: [docker, monitoring, deploy_target]
    dir: ansible/roles/{{.ROLE}}
    vars:
      # Molecule runs ansible-playbook from the PATH, so the virtual environment goes first.
      VENV_BIN: '{{if hasPrefix "/" .VENV}}{{.VENV}}{{else}}{{joinPath .ROOT_DIR .VENV}}{{end}}/bin'
    env:
      MOLECULE_ROLE: "{{.ROLE}}"
    cmds:
      - >-
        PATH="{{.VENV_BIN}}:$PATH" molecule test
        {{if .PLATFORM}}--platform-name "lab-{{.ROLE}}-{{.PLATFORM}}"{{end}}
