# Ansible configuration for the playbooks in this folder. Ansible reads it when a command runs from
# ansible/ (or with ANSIBLE_CONFIG=ansible/ansible.cfg); relative paths are relative to this file.
[defaults]
# The roles kept in this repository (monitoring, docker, deploy_target); the luminare.infra_edge
# and luminare.gameserver roles come from the collections in requirements.yml.
roles_path = roles
# "ansible-galaxy collection install -r requirements.yml" installs into ansible/collections
# (git-ignored), so a run never mixes in collections from another project.
collections_path = collections
# group_vars/*.sops.yaml files are decrypted at run time by the SOPS vars plugin
# (community.sops); a decrypted copy is never written to disk.
vars_plugins_enabled = host_group_vars,community.sops.sops
interpreter_python = auto_silent
callback_result_format = yaml
retry_files_enabled = false
forks = 10

[connection]
# One process per task instead of a copied module file, for every connection plugin that supports
# it (community.docker.docker of the local environment); SSH reads its own section below.
pipelining = true

[ssh_connection]
pipelining = true
