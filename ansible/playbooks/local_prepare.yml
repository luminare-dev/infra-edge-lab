# What the local environment needs before playbooks/site.yml, and nothing a real environment
# would use: "task configure ENV=local" runs it first, from the ansible/ folder, with
#
#   ansible-playbook -i inventories/local playbooks/local_prepare.yml
#
# On the control node it creates the folder .generated/ next to the inventory (git-ignored, mode
# 0700), a throwaway SSH key pair for the users of the base role, and the fake server build of
# tests/fake-artifact/ with its sha256 (group_vars/all.yml and group_vars/fxserver.yml read
# them). On every game server host it puts the fake build where fxserver_artifact_url points.
# Another run changes nothing.
#
# The fake build is a stand-in that answers the game server's HTTP endpoints; it is neither the
# real server nor txAdmin and contains no part of them (tests/fake-artifact/README.md).

- name: Generate the throwaway SSH key pair on the control node
  hosts: all
  gather_facts: false
  tasks:
    - name: Create the folder for generated files
      ansible.builtin.file:
        path: "{{ local_generated_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      run_once: true

    # Ansible reaches the containers through docker exec, so the private key is never used; the
    # base role needs a public key for each of its users.
    - name: Generate the SSH key pair
      ansible.builtin.command:
        argv: [ssh-keygen, -q, -t, ed25519, -N, "", -C, local-environment, -f, "{{ local_generated_dir }}/ssh_key"]
        creates: "{{ local_generated_dir }}/ssh_key.pub"
      delegate_to: localhost
      run_once: true

# The containers of the local environment resolve names through Docker's DNS server on
# 127.0.0.11, which Docker reaches through NAT rules in each container's own network namespace.
# The base role's /etc/nftables.conf starts with "flush ruleset" (docs/adr/0009 of
# luminare.infra_edge), which removes those rules, so every download after the first firewall
# load would fail. This drop-in (local environment only; docs/adr/0022) puts the same two
# translations back in a table of its own, with the ports Docker's DNS server listens on in this
# container, so that every load of the ruleset keeps name resolution working. A real host has no
# such rules and never gets this file.
- name: Keep the containers' name resolution working under the base firewall
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Read the ports of Docker's DNS server in the container
      ansible.builtin.command:
        argv: [ss, -H, -l, -n, -t, -u, src, 127.0.0.11]
      register: local_dns_sockets
      changed_when: false

    - name: Find the TCP and the UDP port
      ansible.builtin.set_fact:
        local_dns_ports:
          tcp: "{{ local_dns_sockets.stdout | regex_search(local_dns_re.tcp, '\\1') | first | default('') }}"
          udp: "{{ local_dns_sockets.stdout | regex_search(local_dns_re.udp, '\\1') | first | default('') }}"
      vars:
        # "tcp LISTEN 0 4096 127.0.0.11:36637 0.0.0.0:*" and "udp UNCONN 0 0 127.0.0.11:58036 0.0.0.0:*"
        local_dns_re:
          tcp: '(?m)^tcp\s+LISTEN\s.*127[.]0[.]0[.]11:([0-9]+)\s'
          udp: '(?m)^udp\s.*127[.]0[.]0[.]11:([0-9]+)\s'

    - name: Require both ports (the container must be on a user-defined Docker network)
      ansible.builtin.assert:
        that:
          - local_dns_ports.tcp is match('^[0-9]+$')
          - local_dns_ports.udp is match('^[0-9]+$')
        fail_msg: >-
          Docker's DNS server does not listen on 127.0.0.11 in this container ({{ local_dns_sockets.stdout }}).
        quiet: true

    - name: Create the nftables drop-in directory of the base role layout
      ansible.builtin.file:
        path: /etc/nftables.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Write the drop-in that keeps Docker's DNS translation
      ansible.builtin.copy:
        dest: /etc/nftables.d/05-local-container-dns.nft
        owner: root
        group: root
        mode: "0644"
        content: |
          # Written by playbooks/local_prepare.yml (local environment only, docs/adr/0022): Docker's
          # DNS server on 127.0.0.11 listens on tcp/{{ local_dns_ports.tcp }} and udp/{{ local_dns_ports.udp }}
          # in this container; these rules translate port 53 to them, as Docker's own rules did
          # before "flush ruleset" removed them.
          table ip local_container_dns {
          	chain output {
          		type nat hook output priority dstnat; policy accept;
          		ip daddr 127.0.0.11 tcp dport 53 dnat to 127.0.0.11:{{ local_dns_ports.tcp }}
          		ip daddr 127.0.0.11 udp dport 53 dnat to 127.0.0.11:{{ local_dns_ports.udp }}
          	}

          	chain postrouting {
          		type nat hook postrouting priority srcnat; policy accept;
          		ip saddr 127.0.0.11 tcp sport {{ local_dns_ports.tcp }} snat to :53
          		ip saddr 127.0.0.11 udp sport {{ local_dns_ports.udp }} snat to :53
          	}
          }

- name: Build the fake server build and put it on the game server hosts
  hosts: fxserver
  become: true
  gather_facts: false
  vars:
    local_fake_dir: "{{ local_generated_dir }}/fake-artifact/{{ fxserver_build }}"
  tasks:
    - name: Create the folder of the fake build on the control node
      ansible.builtin.file:
        path: "{{ local_fake_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Build the fake server build on the control node
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - -I
          - "{{ playbook_dir }}/../../tests/fake-artifact/build.py"
          - --build
          - "{{ fxserver_build }}"
          - --out
          - "{{ local_fake_dir }}/fx.tar.xz"
        creates: "{{ local_fake_dir }}/fx.tar.xz"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Read the sha256 of the fake build
      ansible.builtin.stat:
        path: "{{ local_fake_dir }}/fx.tar.xz"
        checksum_algorithm: sha256
      delegate_to: localhost
      become: false
      run_once: true
      register: local_fake_archive

    - name: Write the sha256 next to it (fxserver_artifact_sha256 in group_vars/fxserver.yml)
      ansible.builtin.copy:
        dest: "{{ local_fake_dir }}/fx.tar.xz.sha256"
        content: "{{ local_fake_archive.stat.checksum }}\n"
        mode: "0600"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Create the folder of fxserver_artifact_url on the host
      ansible.builtin.file:
        path: "{{ fxserver_artifact_url | urlsplit('path') | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy the fake build to the host
      ansible.builtin.copy:
        src: "{{ local_fake_dir }}/fx.tar.xz"
        dest: "{{ fxserver_artifact_url | urlsplit('path') }}"
        owner: root
        group: root
        mode: "0644"
