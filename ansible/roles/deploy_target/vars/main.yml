# Internal values of the deploy_target role (not meant to be overridden).

__deploy_target_forced_command: >-
  {{ deploy_target_rrsync_path }} {{ deploy_target_rrsync_options | join(' ') }} {{ deploy_target_spool_dir }}
__deploy_target_allowed_rrsync_options:
  - -wo
  - -no-del
  - -no-lock
  - -no-overwrite
  - -munge
__deploy_target_path_unit: "/etc/systemd/system/{{ deploy_target_unit_name }}.path"
__deploy_target_service_unit: "/etc/systemd/system/{{ deploy_target_unit_name }}.service"
__deploy_target_key_re: '^(ssh-ed25519|ecdsa-sha2-nistp(256|384|521)|ssh-rsa) [A-Za-z0-9+/]+={0,3}$'
__deploy_target_path_re: '^/[A-Za-z0-9._/-]+$'
