- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart docker
  ansible.builtin.systemd_service:
    name: docker.service
    state: restarted

# Loads /etc/nftables.conf with the new drop-in; with docker_restart_with_nftables, systemd then
# restarts Docker as well (PartOf=), which adds Docker's own rules again. Molecule sets
# docker_firewall_reload: false and restarts nftables.service in its verify step.
- name: Reload nftables
  ansible.builtin.systemd_service:
    name: nftables.service
    state: restarted
  when: docker_firewall_reload | bool
