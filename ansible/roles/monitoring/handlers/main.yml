- name: Restart node_exporter
  ansible.builtin.systemd_service:
    name: node_exporter.service
    state: restarted
    daemon_reload: true
  when: monitoring_node_exporter_enabled | bool

# Loads /etc/nftables.conf with the new drop-in. Molecule sets monitoring_firewall_reload: false
# (the drop-in is still validated with nft --check).
- name: Reload nftables
  ansible.builtin.systemd_service:
    name: nftables.service
    state: restarted
  when: monitoring_firewall_reload | bool
